# Development builds: files in /storage/kodi-dev replace the image's, in Kodi's
# mount namespace only. Absent files are ignored; cb1-install.sh clears the dir.
[Service]
BindReadOnlyPaths=-/storage/kodi-dev/kodi.bin:/usr/lib/kodi/kodi.bin
BindReadOnlyPaths=-/storage/kodi-dev/libdv_engine_vk.so.0:/usr/lib/libdv_engine_vk.so.0
BindReadOnlyPaths=-/storage/kodi-dev/libdv_source_private.so.1:/usr/lib/libdv_source_private.so.1
